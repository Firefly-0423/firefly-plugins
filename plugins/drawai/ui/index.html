<!doctype html>
<html lang="zh-CN" data-theme="firefly-dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrawAI 画布 · Firefly</title><link rel="stylesheet" href="editor.css"><script type="module" src="editor.mjs"></script></head>
<body>
<header><div class="brand"><span class="brand-mark">◇</span><div><strong>DrawAI <span>画布</span></strong><small>FIREFLY WORKSPACE</small></div></div><div class="document-title"><span id="file-name">尚未打开图文件</span><span id="save-state" class="badge">本地文件</span></div><select id="theme" aria-label="界面主题"><option value="firefly-dark">深色</option><option value="pearl-white">浅色</option></select></header>
<nav class="toolbar" aria-label="画布工具"><div class="group"><button id="new">新建</button><button id="open">打开…</button><button id="save" class="primary">保存</button><button id="save-as">另存为…</button></div><div class="group"><button id="undo" title="撤销 Ctrl+Z">↶</button><button id="redo" title="重做 Ctrl+Shift+Z">↷</button></div><div class="group"><button id="mode-select" class="active">选择</button><button id="mode-connect">连线</button><button id="mode-pan">平移</button></div><div class="group"><button id="fit">适合窗口</button><select id="pages" aria-label="当前图页"></select></div><div class="spacer"></div><button id="export-svg">SVG 导出</button><button id="export-png">PNG 导出</button></nav>
<main>
<aside class="library"><div class="section-heading">形状 <span>SHAPES</span></div><p class="muted">点击添加到画布中心</p><div id="shapes" class="shapes"></div><div class="section-heading">图层 <button id="add-layer" title="添加图层">＋</button></div><div id="layers"></div><div class="help-card"><strong>让 AI 接着画</strong><p>保存到会话的工作区，再告诉流萤图文件的路径。AI 使用同一份 .drawio。</p><p>未保存时会保护你的草稿。</p></div><div id="recovery-box" hidden><div class="section-heading">可恢复草稿</div><div id="recovery"></div></div></aside>
<section id="stage" class="stage" aria-label="可编辑流程图"><svg id="canvas" xmlns="http://www.w3.org/2000/svg" tabindex="0" aria-label="流程图画布"></svg><div id="empty" class="empty"><div class="empty-symbol">◇</div><h1>把想法，连成一张图。</h1><p>新建画布，或打开一份 .drawio 文件。</p><button id="empty-new" class="primary">新建画布</button><small>文件留在本机 · 人与 AI 共同编辑</small></div><div class="zoom"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="放大">＋</button></div></section>
<aside class="inspector"><div class="section-heading">属性 <span>PROPERTIES</span></div><div id="no-selection" class="muted selection-empty">选中一个节点或连线<br>在这里调整它</div><form id="properties" hidden><label>文字<textarea id="label" rows="4" maxlength="4096"></textarea></label><div class="two"><label>宽度<input id="width" type="number" min="60" max="10000"></label><label>高度<input id="height" type="number" min="40" max="10000"></label></div><label>节点形状<select id="node-shape"></select></label><label>配色<select id="color"><option value="plain">默认</option><option value="blue">蓝</option><option value="green">绿</option><option value="orange">橙</option><option value="yellow">黄</option><option value="red">红</option><option value="purple">紫</option><option value="grey">灰</option></select></label><label>字体大小<input id="font-size" type="number" min="8" max="72" value="12"></label><label>所在图层<select id="cell-layer"></select></label><div id="edge-properties" hidden><label>线型<select id="line"><option value="sharp">直角折线</option><option value="rounded">圆角折线</option><option value="straight">直线</option><option value="curved">曲线</option></select></label><label>箭头<select id="arrow"><option value="end">单向 →</option><option value="both">双向 ↔</option><option value="none">无箭头</option><option value="start">反向 ←</option></select></label><label>虚线<select id="dash"><option value="solid">实线</option><option value="dashed">虚线</option><option value="dotted">点线</option></select></label><label>起点<select id="edge-from"></select></label><label>终点<select id="edge-to"></select></label></div><button type="submit" class="primary full">应用属性</button></form><div id="selection-actions" hidden><div class="section-heading">对齐与排列</div><div class="actions-grid"><button data-align="left">左对齐</button><button data-align="center">水平居中</button><button data-align="top">顶对齐</button><button data-align="middle">垂直居中</button></div><button id="delete" class="danger full">删除选中</button></div><div class="section-heading space-top">整理布局</div><button id="layout-tb" class="full">从上到下</button><button id="layout-lr" class="full">从左到右</button><button id="layout-grid" class="full">网格排列</button><p id="notes" class="muted"></p></aside>
</main>
<footer><span id="status" role="status" aria-live="polite">准备就绪</span><span class="spacer"></span><span>双击改字 · Shift 多选 · 空格拖动画布 · Ctrl+S 保存</span></footer>
<dialog id="label-dialog"><form method="dialog"><h2>修改文字</h2><textarea id="dialog-label" rows="5" maxlength="4096"></textarea><div class="dialog-actions"><button value="cancel">取消</button><button id="confirm-label" value="confirm" class="primary">应用</button></div></form></dialog>
</body></html>
